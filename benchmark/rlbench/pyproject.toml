[project]
name = "rlbench"
version = "0.1.0"
description = "Setup, run, and collect RL training benchmarks on the cluster kubectl points at"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
rlbench = "rlbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlbench"]
