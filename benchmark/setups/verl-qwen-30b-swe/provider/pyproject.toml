[project]
name = "rlbench-verl-provider"
version = "0.1.0"
description = "uni-agent sandbox provider backed by kubernetes-sigs/agent-sandbox CRs (gVisor on GKE)"
requires-python = ">=3.10"
dependencies = ["kubernetes>=31.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rlbench_verl_provider"]
