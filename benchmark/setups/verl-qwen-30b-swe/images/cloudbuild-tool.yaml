# Cloud Build config for the mini-swe-agent tool sidecar image.
#   gcloud builds submit --config images/cloudbuild-tool.yaml \
#     --substitutions=_IMAGE=<registry>/mini-swe-agent-tool:<tag> .
steps:
- name: gcr.io/cloud-builders/docker
  args: ["buildx", "create", "--use", "--name", "bk"]
- name: gcr.io/cloud-builders/docker
  args: ["buildx", "build", "-f", "images/tool.Dockerfile",
         "-t", "${_IMAGE}", "--push", "."]
options:
  machineType: E2_HIGHCPU_8
timeout: 1800s
