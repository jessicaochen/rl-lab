# One RayCluster spanning all three GPU nodes; verl carves the disaggregated
# trainer pool (2x8, Megatron) and rollout pool (1x8, standalone vLLM) itself
# via `trainer.nnodes` / `rollout.nnodes` placement groups.
# IMPORTANT: Ray places those pools by GPU availability, NOT by our k8s node
# pools — observed: a trainer rank-set on the sampler node and vLLM on a
# trainer node. So every GPU worker group below is IDENTICAL (same mounts,
# GCS FUSE annotation, memory) and any of the three nodes can play any role. The head (cpu-pool)
# runs the driver, the uni-agent gateways (which bind + advertise the pod IP —
# sandboxes reach them directly in-cluster), and the Ray dashboard the
# submitter Job talks to.
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: verl-${JOB_ID:-job1}
  namespace: rlbench-verl-swe
spec:
  rayVersion: "2.49.0"
  headGroupSpec:
    rayStartParams:
      dashboard-host: "0.0.0.0"
      num-gpus: "0"
    template:
      metadata:
        labels:
          app: verl-ray
          rlbench.timeslice.io/job-id: ${JOB_ID:-job1}
          rlbench.timeslice.io/role: head
      spec:
        serviceAccountName: verl-driver
        nodeSelector:
          cloud.google.com/gke-nodepool: ${CPU_POOL}
        initContainers:
        - name: fix-perms
          image: busybox:1.36
          command: ["sh", "-c", "chmod 1777 /data"]
          securityContext: {runAsUser: 0}
          volumeMounts:
          - {name: shared-data, mountPath: /data}
        containers:
        - name: ray-head
          image: ${DRIVER_IMAGE}
          env:
          - name: HF_HOME
            value: /data/hf-cache
          resources:
            requests: {cpu: "${HEAD_CPU_REQ:-10}", memory: ${HEAD_MEM_REQ:-40Gi}}
          volumeMounts:
          - {name: shared-data, mountPath: /data}
        volumes:
        - name: shared-data
          persistentVolumeClaim: {claimName: shared-data}
  workerGroupSpecs:
  - groupName: trainer
    replicas: ${TRAINER_REPLICAS:-2}
    minReplicas: ${TRAINER_REPLICAS:-2}
    maxReplicas: ${TRAINER_REPLICAS:-2}
    rayStartParams:
      num-gpus: "${TRAINER_RAY_GPUS:-8}"
    template:
      metadata:
        labels:
          app: verl-ray
          rlbench.timeslice.io/job-id: ${JOB_ID:-job1}
          rlbench.timeslice.io/role: trainer
        annotations:
          gke-gcsfuse/volumes: "true"        # checkpoint bucket (full runs)
          gke-gcsfuse/cpu-limit: "8"
          gke-gcsfuse/memory-limit: 16Gi
          gke-gcsfuse/ephemeral-storage-limit: 100Gi
      spec:
        serviceAccountName: verl-driver
        nodeSelector:
          cloud.google.com/gke-nodepool: ${TRAINER_POOL}
        tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
        - {key: timeslice.io/shared, operator: Exists, effect: NoSchedule}
        resourceClaims: ${TRAINER_POD_CLAIMS:-[]}
        initContainers:
        - name: fix-perms
          image: busybox:1.36
          command: ["sh", "-c", "chmod 1777 /data"]
          securityContext: {runAsUser: 0}
          volumeMounts:
          - {name: shared-data, mountPath: /data}
        containers:
        - name: ray-worker
          image: ${DRIVER_IMAGE}
          env:
          - name: HF_HOME
            value: /data/hf-cache
          # GKE injects the host NVIDIA driver at /usr/local/nvidia
          - name: LD_LIBRARY_PATH
            value: /usr/local/nvidia/lib64
          # cross-node collectives run over TCP on the default NIC
          - name: NCCL_SOCKET_IFNAME
            value: eth0
          - name: GLOO_SOCKET_IFNAME
            value: eth0
          resources:
            requests:
              ${TRAINER_GPU_REQ:-nvidia.com/gpu: 8}
              cpu: "${WORKER_CPU_REQ:-64}"
              memory: ${WORKER_MEM_REQ:-1024Gi}
            limits:
              ${TRAINER_GPU_LIM:-nvidia.com/gpu: 8}
            claims: ${TRAINER_CONTAINER_CLAIMS:-[]}
          volumeMounts:
          - {name: shared-data, mountPath: /data}
          - {name: ckpt-gcs, mountPath: /ckpt-gcs}
          - {name: dshm, mountPath: /dev/shm}
        volumes:
        - name: shared-data
          persistentVolumeClaim: {claimName: shared-data}
        - name: ckpt-gcs
          csi:
            driver: gcsfuse.csi.storage.gke.io
            volumeAttributes:
              bucketName: ${CKPT_BUCKET}
              mountOptions: "implicit-dirs"
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 256Gi}
  - groupName: rollout
    replicas: 1
    minReplicas: 1
    maxReplicas: 1
    rayStartParams:
      num-gpus: "${ROLLOUT_RAY_GPUS:-8}"
    template:
      metadata:
        labels:
          app: verl-ray
          rlbench.timeslice.io/job-id: ${JOB_ID:-job1}
          rlbench.timeslice.io/role: sampler
        annotations:
          gke-gcsfuse/volumes: "true"
          gke-gcsfuse/cpu-limit: "8"
          gke-gcsfuse/memory-limit: 16Gi
          gke-gcsfuse/ephemeral-storage-limit: 100Gi
      spec:
        serviceAccountName: verl-driver
        nodeSelector:
          cloud.google.com/gke-nodepool: ${SAMPLER_POOL}
        tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
        - {key: timeslice.io/shared, operator: Exists, effect: NoSchedule}
        resourceClaims: ${SAMPLER_POD_CLAIMS:-[]}
        initContainers:
        - name: fix-perms
          image: busybox:1.36
          command: ["sh", "-c", "chmod 1777 /data"]
          securityContext: {runAsUser: 0}
          volumeMounts:
          - {name: shared-data, mountPath: /data}
        containers:
        - name: ray-worker
          image: ${DRIVER_IMAGE}
          env:
          - name: HF_HOME
            value: /data/hf-cache
          - name: LD_LIBRARY_PATH
            value: /usr/local/nvidia/lib64
          - name: NCCL_SOCKET_IFNAME
            value: eth0
          - name: GLOO_SOCKET_IFNAME
            value: eth0
          resources:
            requests:
              ${SAMPLER_GPU_REQ:-nvidia.com/gpu: 8}
              cpu: "${WORKER_CPU_REQ:-64}"
              memory: ${WORKER_MEM_REQ:-1024Gi}
            limits:
              ${SAMPLER_GPU_LIM:-nvidia.com/gpu: 8}
            claims: ${SAMPLER_CONTAINER_CLAIMS:-[]}
          volumeMounts:
          - {name: shared-data, mountPath: /data}
          - {name: ckpt-gcs, mountPath: /ckpt-gcs}
          - {name: dshm, mountPath: /dev/shm}
        volumes:
        - name: shared-data
          persistentVolumeClaim: {claimName: shared-data}
        - name: ckpt-gcs
          csi:
            driver: gcsfuse.csi.storage.gke.io
            volumeAttributes:
              bucketName: ${CKPT_BUCKET}
              mountOptions: "implicit-dirs"
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 256Gi}
